name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: yarn lint
      - run: yarn typecheck
      - run: yarn test --coverage
      - run: yarn build

  native:
    name: Native tests (iOS)
    # Tests ios/FoldableLayoutHost.swift in isolation (native-tests/). The 27.0 SDK on this
    # image covers the compact fallback; the adaptive tree needs SDK 27.1 and runs locally.
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - run: sudo xcode-select -s /Applications/Xcode.app && xcodebuild -version
      - run: native-tests/run.sh

  ios:
    name: Build example (iOS)
    # React Native 0.86 needs Xcode 27. GitHub ships it on the `xcode-27` preview
    # image (Xcode 27.0, iOS 27.0 SDK). The adaptive code path is compile-gated on
    # SDK 27.1, so this job proves the library builds on both sides of the gate.
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: sudo xcode-select -s /Applications/Xcode.app && xcodebuild -version
      - name: Prebuild
        run: yarn example prebuild
        env:
          LANG: en_US.UTF-8
      - name: Cache Pods
        uses: actions/cache@v6
        with:
          path: example/ios/Pods
          key: pods-${{ runner.os }}-${{ hashFiles('example/ios/Podfile.lock') }}
      - name: Build
        run: yarn example build:ios
        env:
          RCT_NEW_ARCH_ENABLED: '1'
