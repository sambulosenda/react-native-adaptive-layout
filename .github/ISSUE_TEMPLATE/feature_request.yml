name: Feature request
description: Propose an API or behaviour change
labels: [enhancement, needs-triage]
body:
  - type: textarea
    id: problem
    attributes: { label: Problem to solve }
    validations: { required: true }
  - type: textarea
    id: proposal
    attributes: { label: Proposed API or behaviour }
  - type: textarea
    id: alternatives
    attributes: { label: Alternatives considered }
